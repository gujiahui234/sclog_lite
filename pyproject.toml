[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "sclog-lite"
version = "0.1.0"
description = "A Loguru extension that writes logs to console, files, and MySQL."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [
  { name = "sclog_lite contributors" },
]
keywords = ["logging", "loguru", "mysql", "async", "batch"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Logging",
  "Typing :: Typed",
]
dependencies = [
  "loguru>=0.7.3,<1",
  "PyMySQL>=1.1.1,<2",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3",
  "pytest-cov>=6",
]
docs = [
  "furo>=2024.8.6",
  "sphinx>=8.2",
  "sphinx-autodoc-typehints>=3",
]
dev = [
  "build>=1.2",
  "mypy>=1.15",
  "ruff>=0.11",
  "twine>=6",
]

[project.urls]
Documentation = "https://sclog-lite.readthedocs.io/"
Repository = "https://github.com/your-name/sclog_lite"
Issues = "https://github.com/your-name/sclog_lite/issues"

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/docs",
  "/examples",
  "/README.md",
  "/LICENSE",
  "/schema.sql",
  "/pyproject.toml",
  "/requirements.txt",
  "/environment.yml",
  "/.readthedocs.yaml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sclog_lite"]

[tool.pytest.ini_options]
minversion = "8.3"
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "integration: requires an explicitly configured MySQL test database",
]

[tool.coverage.run]
branch = true
source = ["sclog_lite"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["sclog_lite"]
mypy_path = "src"
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["pymysql", "pymysql.*", "loguru", "loguru.*"]
ignore_missing_imports = true
